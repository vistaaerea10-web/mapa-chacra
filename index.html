<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa del campamento · Chacra de los Curas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">:root{--bg:#0B1210;--bg2:#101A16;--surface:#141F1A;--surface2:#1A2721;--ink:#EEF2EC;--muted:#98A89E;--line:#24332B;--acc:#F5B233;--display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#EEF1EA;--bg2:#E3E9DF;--surface:#FFFFFF;--surface2:#F5F7F2;--ink:#131A16;--muted:#56655B;--line:#D3DCD0}}
:root[data-theme="light"]{--bg:#EEF1EA;--bg2:#E3E9DF;--surface:#FFFFFF;--surface2:#F5F7F2;--ink:#131A16;--muted:#56655B;--line:#D3DCD0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1210;--bg2:#101A16;--surface:#141F1A;--surface2:#1A2721;--ink:#EEF2EC;--muted:#98A89E;--line:#24332B}}
:root[data-theme="dark"]{--bg:#0B1210;--bg2:#101A16;--surface:#141F1A;--surface2:#1A2721;--ink:#EEF2EC;--muted:#98A89E;--line:#24332B}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);font-family:"Figtree",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px 32px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 0}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.brand svg{width:30px;height:30px;flex:none}
.logo{display:block;height:40px;width:auto}
.logo-pie{height:46px}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .logo{filter:brightness(0)}}
:root[data-theme="light"] .logo{filter:brightness(0)}
.brand span{font-family:var(--display);font-weight:800;font-size:1rem;line-height:1;letter-spacing:.01em}
.brand small{display:block;font-family:"Figtree",sans-serif;font-weight:600;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.hero{padding:34px 0 22px;max-width:760px}
.eyebrow{margin:0 0 10px;font-size:.78rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--acc)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.3rem,9vw,4.4rem);line-height:.95;letter-spacing:-.025em;margin:0}
.lead{color:var(--muted);font-size:1.05rem;margin:14px 0 0;max-width:46ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0 0}
.tools .note{color:var(--muted);font-size:.9rem;width:100%;margin:2px 0 0}
.layout{display:flex;flex-direction:column;gap:20px}
.mapcol{min-width:0}
.mapbox{position:relative;border-radius:22px;overflow:hidden;background:#1B2616;box-shadow:0 30px 70px -20px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
.scroller{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
svg.map{display:block;height:min(52dvh,440px);width:auto;aspect-ratio:1011/520;user-select:none;-webkit-user-select:none}
.swipe{color:var(--muted);font-size:.85rem;margin:10px 2px 0;display:flex;align-items:center;gap:8px}
.swipe::before{content:"";width:22px;height:2px;border-radius:2px;background:var(--acc)}
svg.map.editando .drag{cursor:grab;touch-action:none}
svg.map .pt{cursor:pointer}
.base{transform-origin:50% 50%}
.intro .base{animation:zoom 2.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes zoom{from{transform:scale(1.1);opacity:.15}to{transform:none;opacity:1}}
.intro .zona{transform-box:fill-box;transform-origin:50% 50%;animation:grow .8s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(.9s + var(--i) * 90ms)}
@keyframes grow{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.zona .fill{animation:breathe 3.2s ease-in-out infinite alternate}
@keyframes breathe{from{fill-opacity:.32}to{fill-opacity:.5}}
.intro .badge{animation:drop .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(1.5s + var(--i) * 80ms)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.intro .carpa-d,.intro .marca,.intro .brujula{animation:fadein .6s ease both;animation-delay:2.3s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.camino-line{stroke-dasharray:6 7;animation:march 1s linear infinite}
.intro .camino{animation:fadein .7s ease 1.3s both}
@keyframes march{to{stroke-dashoffset:-13}}
.llama{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1)}50%{transform:scale(.88,1.1)}100%{transform:scale(1.06,.94)}}
.ring{fill:none;stroke:#fff;stroke-width:2.5;opacity:0}
.pt.active .ring{animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{opacity:.95;r:14}100%{opacity:0;r:30}}
.pt.active .sq{stroke:#fff;stroke-width:2.5}
.pt.active .zline{stroke:#fff;stroke-width:3}
.pt:focus{outline:none}
.pt:focus-visible .sq{stroke:var(--acc);stroke-width:3}
.editando .pt .zline{stroke-dasharray:5 4}
.carpa-d.sel{filter:drop-shadow(0 0 4px #fff)}
.panel{width:100%;min-width:0}
.phead{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px}
.phead h2{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.01em;margin:0}
.phead span{color:var(--muted);font-size:.9rem}
.zonas{list-style:none;margin:0;padding:2px 2px 10px;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.zonas::-webkit-scrollbar{display:none}
.zonas li{flex:0 0 78%;scroll-snap-align:start}
.zc{width:100%;height:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .2s,background .2s,transform .2s}
.zc:hover{border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.zc.active{background:var(--surface2);border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.zc:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.zi{width:40px;height:40px;border-radius:11px;background:var(--c);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px -6px var(--c)}
.zi svg{width:24px;height:24px;overflow:visible}
.zt{min-width:0}
.zt b{display:block;font-family:var(--display);font-weight:700;font-size:1.08rem;line-height:1.15;margin:1px 0 4px}
.zt small{display:block;color:var(--muted);font-size:.9rem;line-height:1.4;white-space:pre-line}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h2{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1;margin:0 0 10px}
.card p.t{margin:0 0 14px;color:var(--muted)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:.95rem;border-radius:999px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#111}
.btn.ghost{margin-left:auto;color:var(--muted);border-color:transparent;background:transparent}
.btn.danger{color:#E0605A}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,.field input:focus-visible,.field textarea:focus-visible,.field select:focus-visible,.sw:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:.85rem;color:var(--muted);margin:0 0 4px}
.field input:not([type]),.field textarea,.field select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.field textarea{min-height:80px;resize:vertical}
.field input[type=range]{width:100%;accent-color:var(--acc)}
.check{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:.95rem}
.check input{width:18px;height:18px;accent-color:var(--acc)}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:9px;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.hint{color:var(--muted);margin:0}
.msg{color:var(--muted);min-height:1.5em;margin:12px 0 0;text-align:center}
.pie{margin-top:36px;padding:26px 0 8px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.pie p{margin:0;color:var(--muted);font-size:.9rem}
@media (min-width:900px){
  .wrap{padding:0 28px 40px}
  .hero{padding:30px 0 22px;max-width:none;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 40px}
  .hero h1{font-size:clamp(2.6rem,4.4vw,3.8rem)}
  .hero .eyebrow{width:100%}
  .hero .lead{margin:0 0 6px}
  .hero .tools{width:100%;margin-top:6px}
  .layout{flex-direction:row;align-items:flex-start;gap:24px}
  .mapcol{flex:1}
  svg.map{width:100%;height:auto}
  .swipe{display:none}
  .panel{flex:0 0 340px;position:sticky;top:20px;max-height:calc(100dvh - 40px);overflow:auto;padding-right:2px}
  .zonas{flex-direction:column;overflow:visible;scroll-snap-type:none}
  .zonas li{flex:none}
}
@media (prefers-reduced-motion:reduce){.intro .base,.intro .zona,.intro .badge,.intro .carpa-d,.intro .marca,.intro .brujula,.intro .camino,.zona .fill,.camino-line,.llama,.pt.active .ring,.card{animation:none}.zc{transition:none}}
body.print{background:#fff;margin:0}
body.print #root>svg{display:block;width:297mm;height:210mm}
@page{size:A4 landscape;margin:0}
</style>
</head>

/* ---------- tocar y arrastrar ---------- */
let drag=null;
function pSVG(e){const s=$("svg"),pt=s.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(s.getScreenCTM().inverse())}
const M=$("mapa");
M.addEventListener("pointerdown",e=>{
  const el=e.target.closest("[data-part]");if(!el)return;
  const part=el.dataset.part,i=+el.dataset.i;
  const els=part==="c"?[el]:[...M.querySelectorAll(`[data-part="m"][data-i="${i}"]`)];
  drag={els,part,i,p0:pSVG(e),cx:e.clientX,cy:e.clientY,moved:false};
  if(editando){M.setPointerCapture(e.pointerId);e.preventDefault()}
});
M.addEventListener("pointermove",e=>{
  if(!drag)return;
  if(Math.hypot(e.clientX-drag.cx,e.clientY-drag.cy)>6)drag.moved=true;
  if(!editando||!drag.moved)return;
  const p=pSVG(e),dx=p.x-drag.p0.x,dy=p.y-drag.p0.y;
  drag.els.forEach(el=>el.style.transform=`translate(${dx}px,${dy}px)`);
});
function soltar(e){
  if(!drag)return;const d=drag;drag=null;
  if(!d.moved){ if(d.part==="c"){ if(editando){selCarpa=d.i;sel=-1;refrescar()} } else abrir(d.i); return }
  if(!editando)return;
  const p=pSVG(e),dx=p.x-d.p0.x,dy=p.y-d.p0.y,cl=(v,a,b)=>Math.round(Math.min(b,Math.max(a,v)));
  if(d.part==="c"){const c=S.carpas[d.i];c[0]=cl(c[0]+dx,8,W-8);c[1]=cl(c[1]+dy,8,H-8);selCarpa=d.i;sel=-1}
  else{const pt=S.puntos[d.i];pt.x=cl(pt.x+dx,14,W-14);pt.y=cl(pt.y+dy,14,H-14);sel=d.i;selCarpa=-1}
  refrescar();
}
M.addEventListener("pointerup",soltar);
M.addEventListener("pointercancel",()=>{drag=null;dibujar()});
M.addEventListener("keydown",e=>{const g=e.target.closest(".badge");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();abrir(+g.dataset.i)}});

/* ---------- guardar ---------- */
async function guardar(){
  const art=window.claude?await window.claude.use("artifact"):null;
  if(!art){msg("Esta vista no permite guardar. Abrí el mapa desde tu cuenta de Claude.");return}
  $("bSave").disabled=true;msg("Guardando…");
  try{await art.publish(documento());msg("Guardado. La página se actualiza para todos.")}
  catch(err){const c=err&&err.code;
    if(c==="conflict")msg("Había una versión más nueva; se está recargando.");
    else if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"||c==="capability_disabled"){soloLectura=true;editando=false;msg("Esta vista es solo de lectura: no se pueden guardar cambios.");refrescar()}
    else if(c==="rate_limited")msg("Demasiados guardados seguidos. Esperá un momento y volvé a guardar.");
    else if(c==="too_large")msg("El mapa quedó demasiado pesado para guardarse.");
    else msg("No se pudo guardar ("+(c||"error")+"). Probá de nuevo.");
    const b=$("bSave");b&&(b.disabled=false)}
}

/* ---------- PDF para imprimir ---------- */
async function descargar(){
  const dl=window.claude?await window.claude.use("downloads"):null;
  if(!dl||!window.jspdf){msg("No se pudo preparar la descarga en esta vista.");return}
  msg("Preparando el PDF…");
  try{
    const img=new Image();
    await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(paginaImpresion())});
    const c=document.createElement("canvas");c.width=3508;c.height=2480;
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    const pdf=new window.jspdf.jsPDF({orientation:"l",unit:"mm",format:"a4"});
    pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,297,210);
    await dl.save({filename:"mapa-campamento.pdf",data:pdf.output("blob")});
    msg("");
  }catch(err){const c=err&&err.code;msg(c==="declined"||c==="cancelled"?"":"No se pudo descargar el PDF.")}
}

/* ---------- inicio ---------- */
refrescar();
let centrado=false;const cIni=()=>{if(centrado||sel>=0)return;const sc=$("scroller");if(sc.scrollWidth>sc.clientWidth+10){centrar(360,false);if(sc.scrollLeft>0)centrado=true}else if(sc.scrollWidth>0&&sc.scrollWidth<=sc.clientWidth+10)centrado=true};
[60,300,800,1500,2500].forEach(t=>setTimeout(cIni,t));addEventListener("load",cIni);$("scroller").addEventListener("pointerdown",()=>{centrado=true},{once:true});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!drag)dibujar()});
(async()=>{
  
  try{const u=window.claude?await window.claude.use("user"):null;
    if(u&&((await u.isOwner())||(await u.canEdit())))dueno=true}catch(e){}
  herramientas();
})();
})();
</script>
