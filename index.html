<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa del campamento · Chacra de los Curas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">:root{--bg:#0B1210;--bg2:#101A16;--surface:#141F1A;--surface2:#1A2721;--ink:#EEF2EC;--muted:#98A89E;--line:#24332B;--acc:#F5B233;--display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#EEF1EA;--bg2:#E3E9DF;--surface:#FFFFFF;--surface2:#F5F7F2;--ink:#131A16;--muted:#56655B;--line:#D3DCD0}}
:root[data-theme="light"]{--bg:#EEF1EA;--bg2:#E3E9DF;--surface:#FFFFFF;--surface2:#F5F7F2;--ink:#131A16;--muted:#56655B;--line:#D3DCD0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1210;--bg2:#101A16;--surface:#141F1A;--surface2:#1A2721;--ink:#EEF2EC;--muted:#98A89E;--line:#24332B}}
:root[data-theme="dark"]{--bg:#0B1210;--bg2:#101A16;--surface:#141F1A;--surface2:#1A2721;--ink:#EEF2EC;--muted:#98A89E;--line:#24332B}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);font-family:"Figtree",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px 32px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 0}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.brand svg{width:30px;height:30px;flex:none}
.brand span{font-family:var(--display);font-weight:800;font-size:1rem;line-height:1;letter-spacing:.01em}
.brand small{display:block;font-family:"Figtree",sans-serif;font-weight:600;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.hero{padding:34px 0 22px;max-width:760px}
.eyebrow{margin:0 0 10px;font-size:.78rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--acc)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.3rem,9vw,4.4rem);line-height:.95;letter-spacing:-.025em;margin:0}
.lead{color:var(--muted);font-size:1.05rem;margin:14px 0 0;max-width:46ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0 0}
.tools .note{color:var(--muted);font-size:.9rem;width:100%;margin:2px 0 0}
.layout{display:flex;flex-direction:column;gap:20px}
.mapcol{min-width:0}
.mapbox{position:relative;border-radius:22px;overflow:hidden;background:#1B2616;box-shadow:0 30px 70px -20px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
.scroller{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
svg.map{display:block;height:min(52dvh,440px);width:auto;aspect-ratio:838/528;user-select:none;-webkit-user-select:none}
.swipe{color:var(--muted);font-size:.85rem;margin:10px 2px 0;display:flex;align-items:center;gap:8px}
.swipe::before{content:"";width:22px;height:2px;border-radius:2px;background:var(--acc)}
svg.map.editando .drag{cursor:grab;touch-action:none}
svg.map .pt{cursor:pointer}
.base{transform-origin:50% 50%}
.intro .base{animation:zoom 2.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes zoom{from{transform:scale(1.1);opacity:.15}to{transform:none;opacity:1}}
.intro .zona{transform-box:fill-box;transform-origin:50% 50%;animation:grow .8s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(.9s + var(--i) * 90ms)}
@keyframes grow{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.zona .fill{animation:breathe 3.2s ease-in-out infinite alternate}
@keyframes breathe{from{fill-opacity:.32}to{fill-opacity:.5}}
.intro .badge{animation:drop .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(1.5s + var(--i) * 80ms)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.intro .carpa-d,.intro .marca,.intro .brujula{animation:fadein .6s ease both;animation-delay:2.3s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.camino-line{stroke-dasharray:6 7;animation:march 1s linear infinite}
.intro .camino{animation:fadein .7s ease 1.3s both}
@keyframes march{to{stroke-dashoffset:-13}}
.llama{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1)}50%{transform:scale(.88,1.1)}100%{transform:scale(1.06,.94)}}
.ring{fill:none;stroke:#fff;stroke-width:2.5;opacity:0}
.pt.active .ring{animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{opacity:.95;r:14}100%{opacity:0;r:30}}
.pt.active .sq{stroke:#fff;stroke-width:2.5}
.pt.active .zline{stroke:#fff;stroke-width:3}
.pt:focus{outline:none}
.pt:focus-visible .sq{stroke:var(--acc);stroke-width:3}
.editando .pt .zline{stroke-dasharray:5 4}
.carpa-d.sel{filter:drop-shadow(0 0 4px #fff)}
.panel{width:100%;min-width:0}
.phead{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px}
.phead h2{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.01em;margin:0}
.phead span{color:var(--muted);font-size:.9rem}
.zonas{list-style:none;margin:0;padding:2px 2px 10px;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.zonas::-webkit-scrollbar{display:none}
.zonas li{flex:0 0 78%;scroll-snap-align:start}
.zc{width:100%;height:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .2s,background .2s,transform .2s}
.zc:hover{border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.zc.active{background:var(--surface2);border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.zc:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.zi{width:40px;height:40px;border-radius:11px;background:var(--c);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px -6px var(--c)}
.zi svg{width:24px;height:24px;overflow:visible}
.zt{min-width:0}
.zt b{display:block;font-family:var(--display);font-weight:700;font-size:1.08rem;line-height:1.15;margin:1px 0 4px}
.zt small{display:block;color:var(--muted);font-size:.9rem;line-height:1.4;white-space:pre-line}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h2{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1;margin:0 0 10px}
.card p.t{margin:0 0 14px;color:var(--muted)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:.95rem;border-radius:999px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#111}
.btn.ghost{margin-left:auto;color:var(--muted);border-color:transparent;background:transparent}
.btn.danger{color:#E0605A}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,.field input:focus-visible,.field textarea:focus-visible,.field select:focus-visible,.sw:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:.85rem;color:var(--muted);margin:0 0 4px}
.field input:not([type]),.field textarea,.field select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.field textarea{min-height:80px;resize:vertical}
.field input[type=range]{width:100%;accent-color:var(--acc)}
.check{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:.95rem}
.check input{width:18px;height:18px;accent-color:var(--acc)}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:9px;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.hint{color:var(--muted);margin:0}
.msg{color:var(--muted);min-height:1.5em;margin:12px 0 0;text-align:center}
.pie{margin-top:36px;padding:26px 0 8px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.pie p{margin:0;color:var(--muted);font-size:.9rem}
@media (min-width:900px){
  .wrap{padding:0 28px 40px}
  .hero{padding:30px 0 22px;max-width:none;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 40px}
  .hero h1{font-size:clamp(2.6rem,4.4vw,3.8rem)}
  .hero .eyebrow{width:100%}
  .hero .lead{margin:0 0 6px}
  .hero .tools{width:100%;margin-top:6px}
  .layout{flex-direction:row;align-items:flex-start;gap:24px}
  .mapcol{flex:1}
  svg.map{width:100%;height:auto}
  .swipe{display:none}
  .panel{flex:0 0 340px;position:sticky;top:20px;max-height:calc(100dvh - 40px);overflow:auto;padding-right:2px}
  .zonas{flex-direction:column;overflow:visible;scroll-snap-type:none}
  .zonas li{flex:none}
}
@media (prefers-reduced-motion:reduce){.intro .base,.intro .zona,.intro .badge,.intro .carpa-d,.intro .marca,.intro .brujula,.intro .camino,.zona .fill,.camino-line,.llama,.pt.active .ring,.card{animation:none}.zc{transition:none}}
body.print{background:#fff;margin:0}
body.print #root>svg{display:block;width:297mm;height:210mm}
@page{size:A4 landscape;margin:0}
</style>
</head>

    d+=`C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`}
  return d+"Z";
}
function camino(){
  const a=S.puntos.find(p=>p.icono==="ingreso"),b=S.puntos.find(p=>p.icono==="fogon");
  if(!a||!b)return null;
  return {d:`M${a.x} ${H+4}L${a.x} ${a.y}C${a.x} ${a.y-60} ${b.x} ${b.y+70} ${b.x} ${b.y+16}`,c:a.color};
}
function marca(){
  const t='fill="#fff" stroke="rgba(0,0,0,.6)" stroke-width="2.6" paint-order="stroke" stroke-linejoin="round"';
  return `<g class="marca" transform="translate(30 14)" opacity=".9" pointer-events="none"><g transform="translate(13 13)" filter="url(#sh)"><path d="M-7-7L7 7M7-7L-7 7" stroke="#fff" stroke-width="2.2"/><rect x="-4" y="-3" width="8" height="6" rx="2" fill="#fff"/>${[[-7,-7],[7,-7],[-7,7],[7,7]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="4" fill="none" stroke="#fff" stroke-width="1.6"/>`).join("")}</g>
<text x="31" y="12" font-size="13" font-weight="800" letter-spacing=".6" ${t}>VISTA AÉREA</text><text x="31" y="24" font-size="8" font-weight="700" letter-spacing="2.2" ${t.replace("2.6","2.2")}>PRODUCCIONES</text></g>`;
}
function mapa(font,opt){
  opt=opt||{};const ed=opt.editando,pr=opt.print;
  let s=`<defs><filter id="sh" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000" flood-opacity=".55"/></filter>
<filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<g font-family='${font}'><image class="base" href="${IMG}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="none"/>
<rect width="${W}" height="${H}" fill="#0b1a10" opacity=".14"/>`;
  S.puntos.forEach((p,i)=>{ if(!p.zona)return; const d=mancha(p);
    s+=`<g class="zona pt${opt.sel===i?" active":""}${ed?" drag":""}" data-part="m" data-i="${i}" style="--i:${i}"><path d="${d}" fill="none" stroke="${p.color}" stroke-width="7" opacity=".7" filter="url(#bl)"/><path class="fill" d="${d}" fill="${p.color}" fill-opacity=".42"/><path class="zline" d="${d}" fill="none" stroke="${p.color}" stroke-width="2.2"/></g>`});
  const cam=camino();
  if(cam)s+=`<g class="camino"><path d="${cam.d}" fill="none" stroke="${cam.c}" stroke-width="11" stroke-opacity=".5" stroke-linecap="round"/><path class="camino-line" d="${cam.d}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>`;
  s+=S.carpas.map((c,i)=>`<g class="carpa-d${opt.selCarpa===i?" sel":""}${ed?" drag":""}" data-part="c" data-i="${i}" transform="translate(${c[0]} ${c[1]})"><path d="M-7 5.5L0-6 7 5.5z" fill="#fff" stroke="#222" stroke-width="1.3" stroke-linejoin="round" filter="url(#sh)"/><path d="M0-6v11.5M-2 5.5L0 1.5l2 4" fill="none" stroke="#222" stroke-width="1.2"/>${pr?"":`<rect x="-11" y="-10" width="22" height="20" fill="transparent"/>`}</g>`).join("");
  S.puntos.forEach((p,i)=>{
    const big=!!p.zona;
    s+=`<g class="pt badge${opt.sel===i?" active":""}${ed?" drag":""}" data-part="m" data-i="${i}" style="--i:${i}" ${pr?"":`tabindex="0" role="button" aria-label="${esc(p.nombre||ICONOS[p.icono])}"`}><g transform="translate(${p.x} ${p.y})">`;
    if(!pr)s+=`<circle class="ring" r="14"/>`;
    s+=`<g filter="url(#sh)"><rect class="sq" x="-13" y="-13" width="26" height="26" rx="7" fill="${p.color}" stroke="rgba(255,255,255,.85)" stroke-width="1.6"/></g>${glifo(p.icono)}`;
    if(p.nombre&&p.etiqueta!==false)s+=`<text x="0" y="${big?27:25}" text-anchor="middle" dominant-baseline="central" font-size="${big?15:12.5}" font-weight="800" fill="#fff" stroke="rgba(0,0,0,.7)" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round" letter-spacing=".2">${esc(p.nombre)}</text>`;
    s+=`</g></g>`;
  });
  return s+marca()+brujula()+`</g>`;
}
function brujula(){const t='fill="#fff" stroke="rgba(0,0,0,.6)" stroke-width="2.4" paint-order="stroke"';return `<g class="brujula" transform="translate(${W-66} 34)" pointer-events="none" filter="url(#sh)"><circle r="15" fill="rgba(10,20,14,.45)" stroke="#fff" stroke-width="1.4"/><path d="M0-11l4 11h-8z" fill="#fff"/><path d="M0 11l4-11h-8z" fill="rgba(255,255,255,.45)"/><text x="0" y="-22" text-anchor="middle" font-size="10" font-weight="800" ${t}>N</text></g>`}

/* ---------- impresión: A4 apaisado, QR en la esquina ---------- */
function paginaImpresion(){
  const t=(S.titulo||"").toUpperCase(),fs=96;
  const cv=document.createElement("canvas").getContext("2d");cv.font=`800 ${fs}px ${FONT_PRINT}`;const tw=cv.measureText(t).width+130;
  const q=S.qr,QS=340,m=QS/(q.n+8),MX=100,MY=280,MW=2770,MH=Math.round(MW*H/W),CW=420,CH=500,CX=MX+MW-CW-40,CY=MY+MH-CH-40;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2970 2100" width="2970" height="2100">
<rect width="2970" height="2100" fill="#fff"/>
<rect x="${1485-tw/2}" y="70" width="${tw}" height="160" rx="80" fill="#fff" stroke="#111" stroke-width="7"/>
<text x="1485" y="152" text-anchor="middle" dominant-baseline="central" font-family='${FONT_PRINT}' font-weight="800" font-size="${fs}" fill="#111">${esc(t)}</text>
<clipPath id="cm"><rect x="${MX}" y="${MY}" width="${MW}" height="${MH}" rx="30"/></clipPath>
<g clip-path="url(#cm)"><svg x="${MX}" y="${MY}" width="${MW}" height="${MH}" viewBox="0 0 ${W} ${H}">${mapa(FONT_PRINT,{print:true})}</svg></g>
<g transform="translate(${CX} ${CY})"><rect width="${CW}" height="${CH}" rx="26" fill="#fff" stroke="#111" stroke-width="5"/>
<g transform="translate(${(CW-QS)/2+4*m} ${30+4*m}) scale(${m})"><path d="${q.d}" fill="#111"/></g>
<text x="${CW/2}" y="${CH-68}" text-anchor="middle" font-family='${FONT_PRINT}' font-weight="800" font-size="38" fill="#111">ESCANEÁ EL QR</text>
<text x="${CW/2}" y="${CH-24}" text-anchor="middle" font-family='${FONT_PRINT}' font-size="30" fill="#111">y recorré el mapa</text></g>
</svg>`;
}

/* ---------- documento completo para guardar ---------- */
function documento(){
  const st=JSON.stringify(S).replace(/</g,"\\u003c"),E="</"+"script>";
  return `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>${esc(S.titulo)} · Chacra de los Curas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">${document.getElementById("css").textContent}</style>
</head>
<body>
<div id="root"></div>
<script id="img" type="text/plain">${document.getElementById("img").textContent}${E}
<script id="estado" type="application/json">${st}${E}
<script src="${JSPDF}">${E}
<script id="app">${document.getElementById("app").textContent}${E}
</body>
</html>
`;
}

if(location.hash==="#imprimir"){document.body.className="print";document.getElementById("root").innerHTML=paginaImpresion();return;}

/* ---------- interfaz ---------- */
const root=document.getElementById("root");
const DRONE=`<svg viewBox="-16 -16 32 32" aria-hidden="true"><path d="M-8-8L8 8M8-8L-8 8" stroke="currentColor" stroke-width="2.4"/><rect x="-4.5" y="-3.5" width="9" height="7" rx="2.2" fill="currentColor"/><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="-8" cy="-8" r="4.6"/><circle cx="8" cy="-8" r="4.6"/><circle cx="-8" cy="8" r="4.6"/><circle cx="8" cy="8" r="4.6"/></g></svg>`;
root.innerHTML=`<div class="wrap"><header class="top"><div class="brand">${DRONE}<span>Vista Aérea<small>Producciones</small></span></div></header>
<section class="hero"><p class="eyebrow">Chacra de los Curas</p><h1 id="titulo"></h1><p class="lead">Tocá una zona del mapa o de la lista para ver qué hay en cada lugar.</p><div class="tools" id="tools" hidden></div></section>
<div class="layout"><div class="mapcol"><div class="mapbox"><div class="scroller" id="scroller"><div id="mapa"></div></div></div><p class="swipe">Deslizá el mapa para recorrer toda la chacra</p></div>
<section class="panel" id="panel" aria-live="polite"></section></div><p class="msg" id="msg" role="status"></p>
<footer class="pie"><div class="brand">${DRONE}<span>Vista Aérea<small>Producciones</small></span></div><p>Mapa realizado por Vista Aérea Producciones</p></footer></div>`;
const $=id=>document.getElementById(id);
let sel=-1,selCarpa=-1,editando=false,dueno=false,primera=true,soloLectura=false;
const msg=t=>{$("msg").textContent=t||""};

function dibujar(){
  $("titulo").textContent=S.titulo;const sc=$("scroller"),sl=sc.scrollLeft;
  $("mapa").innerHTML=`<svg class="map${primera&&!reduce?" intro":""}${editando?" editando":""}" id="svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa del campamento sobre la foto aérea de la chacra">${mapa(FONT_SCREEN,{sel,selCarpa,editando})}</svg>`;sc.scrollLeft=sl;
  if(primera){primera=false;setTimeout(()=>{const s=$("svg");s&&s.classList.remove("intro")},4000);}
}
function centrar(x,suave){const sc=$("scroller"),sv=$("svg");if(!sv)return;const px=sv.getBoundingClientRect().width*x/W;
  const L=Math.max(0,px-sc.clientWidth/2);if(suave&&!reduce)sc.scrollTo({left:L,behavior:"smooth"});else sc.scrollLeft=L}
function vistaX(){const sc=$("scroller"),sv=$("svg");const w=sv.getBoundingClientRect().width;return Math.round((sc.scrollLeft+sc.clientWidth/2)/w*W)}
function herramientas(){
  const t=$("tools");
  if(!dueno){t.hidden=true;return}
  t.hidden=false;
  const cambios=JSON.stringify(S)!==saved;
  t.innerHTML=editando?`<button class="btn" id="bAddP">Agregar punto</button><button class="btn" id="bAddC">Agregar carpa</button>
<button class="btn primary" id="bSave"${cambios?"":" disabled"}>Guardar cambios</button><button class="btn" id="bCancel">Salir sin guardar</button>
<p class="note">Arrastrá los íconos, las zonas y las carpas para moverlos. Tocá uno para editarlo.${cambios?" Hay cambios sin guardar.":""}</p>`
  :`<button class="btn" id="bEdit"${soloLectura?" disabled":""}>Editar mapa</button><button class="btn primary" id="bPrint">Descargar para imprimir</button>`;
  const on=(id,f)=>{const b=$(id);b&&(b.onclick=f)};
  on("bEdit",()=>{editando=true;msg();refrescar()});
  on("bCancel",()=>{S=JSON.parse(saved);editando=false;sel=-1;selCarpa=-1;msg();refrescar()});
  on("bSave",guardar);
  on("bPrint",descargar);
  on("bAddP",()=>{S.puntos.push({id:"p"+Date.now(),nombre:"Nuevo punto",texto:"",icono:"punto",color:COLOR_DEF.punto,x:vistaX(),y:260,zona:null,etiqueta:true});sel=S.puntos.length-1;selCarpa=-1;refrescar()});
  on("bAddC",()=>{S.carpas.push([vistaX(),260]);selCarpa=S.carpas.length-1;sel=-1;refrescar()});
}
const cuadro=c=>`<i style="background:${c}"></i>`;
function tarjeta(i){const p=S.puntos[i];return `<li><button class="zc${sel===i?" active":""}" data-i="${i}" style="--c:${p.color}"><span class="zi"><svg viewBox="-12 -12 24 24" aria-hidden="true">${glifo(p.icono)}</svg></span><span class="zt"><b>${esc(p.nombre)}</b>${p.texto?`<small>${esc(p.texto)}</small>`:""}</span></button></li>`}
function panelVista(){
  const P=$("panel"),vis=S.puntos.map((p,i)=>i).filter(i=>S.puntos[i].nombre);
  P.innerHTML=`<div class="phead"><h2>Zonas</h2><span>${vis.length} lugares</span></div><ol class="zonas" id="zonas">${vis.map(tarjeta).join("")}</ol>`;
  P.querySelectorAll(".zc").forEach(c=>c.onclick=()=>abrir(+c.dataset.i));
}
function marcar(){document.querySelectorAll(".zc").forEach(c=>c.classList.toggle("active",+c.dataset.i===sel))}
function panelEdicion(){
  const P=$("panel");
  if(sel>=0){const p=S.puntos[sel];
    P.innerHTML=`<article class="card"><label class="field"><span>Nombre</span><input id="fN" value="${esc(p.nombre)}" maxlength="40"></label>
<label class="check"><input type="checkbox" id="fE"${p.etiqueta!==false?" checked":""}> Mostrar el nombre en el mapa</label>
<label class="field"><span>Descripción</span><textarea id="fT">${esc(p.texto)}</textarea></label>
<label class="field"><span>Ícono</span><select id="fI">${Object.entries(ICONOS).map(([k,v])=>`<option value="${k}"${k===p.icono?" selected":""}>${v}</option>`).join("")}</select></label>
<div class="field"><span>Color</span><div class="sws">${PALETA.map(c=>`<button class="sw${c===p.color?" on":""}" data-c="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join("")}</div></div>
<label class="check"><input type="checkbox" id="fZ"${p.zona?" checked":""}> Pintar una zona de color alrededor</label>
${p.zona?`<label class="field"><span>Ancho de la zona</span><input type="range" id="fRx" min="18" max="220" value="${p.zona.rx}"></label><label class="field"><span>Alto de la zona</span><input type="range" id="fRy" min="14" max="160" value="${p.zona.ry}"></label>`:""}
<div class="nav"><button class="btn danger" id="fDel">Borrar punto</button><button class="btn ghost" id="fOk">Listo</button></div></article>`;
    let tm;const up=()=>{clearTimeout(tm);tm=setTimeout(()=>{dibujar();herramientas()},120)};
    $("fN").oninput=e=>{p.nombre=e.target.value;up()};
    $("fE").onchange=e=>{p.etiqueta=e.target.checked;dibujar();herramientas()};
    $("fT").oninput=e=>{p.texto=e.target.value;herramientas()};
    $("fI").onchange=e=>{const old=p.icono;p.icono=e.target.value;if(p.color===COLOR_DEF[old])p.color=COLOR_DEF[p.icono];refrescar()};
    P.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{p.color=b.dataset.c;refrescar()});
    $("fZ").onchange=e=>{p.zona=e.target.checked?{rx:60,ry:45}:null;refrescar()};
    if(p.zona){$("fRx").oninput=e=>{p.zona.rx=+e.target.value;up()};$("fRy").oninput=e=>{p.zona.ry=+e.target.value;up()}}
    $("fDel").onclick=()=>{S.puntos.splice(sel,1);sel=-1;refrescar()};
    $("fOk").onclick=()=>{sel=-1;refrescar()};
    return}
  if(selCarpa>=0){P.innerHTML=`<article class="card"><h2>Carpa</h2><p class="t">Arrastrala para moverla.</p><div class="nav"><button class="btn danger" id="cDel">Quitar carpa</button><button class="btn ghost" id="cOk">Listo</button></div></article>`;
    $("cDel").onclick=()=>{S.carpas.splice(selCarpa,1);selCarpa=-1;refrescar()};
    $("cOk").onclick=()=>{selCarpa=-1;refrescar()};return}
  P.innerHTML=`<p class="hint">Tocá un ícono, una zona o una carpa para editarlo, o arrastralo para cambiarlo de lugar.</p>`;
}
function refrescar(){dibujar();herramientas();editando?panelEdicion():panelVista()}
function abrir(i){sel=i;selCarpa=-1;
  if(editando){refrescar();return}
  dibujar();marcar();centrar(S.puntos[i].x,true);
  const c=document.querySelector(`.zc[data-i="${i}"]`);
  if(c){const z=$("zonas");if(innerWidth<900){z.scrollTo({left:c.parentNode.offsetLeft-z.offsetLeft-2,behavior:reduce?"auto":"smooth"})}else c.scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"})}}

/* ---------- tocar y arrastrar ---------- */
let drag=null;
function pSVG(e){const s=$("svg"),pt=s.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(s.getScreenCTM().inverse())}
const M=$("mapa");
M.addEventListener("pointerdown",e=>{
  const el=e.target.closest("[data-part]");if(!el)return;
  const part=el.dataset.part,i=+el.dataset.i;
  const els=part==="c"?[el]:[...M.querySelectorAll(`[data-part="m"][data-i="${i}"]`)];
  drag={els,part,i,p0:pSVG(e),cx:e.clientX,cy:e.clientY,moved:false};
  if(editando){M.setPointerCapture(e.pointerId);e.preventDefault()}
});
M.addEventListener("pointermove",e=>{
  if(!drag)return;
  if(Math.hypot(e.clientX-drag.cx,e.clientY-drag.cy)>6)drag.moved=true;
  if(!editando||!drag.moved)return;
  const p=pSVG(e),dx=p.x-drag.p0.x,dy=p.y-drag.p0.y;
  drag.els.forEach(el=>el.style.transform=`translate(${dx}px,${dy}px)`);
});
function soltar(e){
  if(!drag)return;const d=drag;drag=null;
  if(!d.moved){ if(d.part==="c"){ if(editando){selCarpa=d.i;sel=-1;refrescar()} } else abrir(d.i); return }
  if(!editando)return;
  const p=pSVG(e),dx=p.x-d.p0.x,dy=p.y-d.p0.y,cl=(v,a,b)=>Math.round(Math.min(b,Math.max(a,v)));
  if(d.part==="c"){const c=S.carpas[d.i];c[0]=cl(c[0]+dx,8,W-8);c[1]=cl(c[1]+dy,8,H-8);selCarpa=d.i;sel=-1}
  else{const pt=S.puntos[d.i];pt.x=cl(pt.x+dx,14,W-14);pt.y=cl(pt.y+dy,14,H-14);sel=d.i;selCarpa=-1}
  refrescar();
}
M.addEventListener("pointerup",soltar);
M.addEventListener("pointercancel",()=>{drag=null;dibujar()});
M.addEventListener("keydown",e=>{const g=e.target.closest(".badge");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();abrir(+g.dataset.i)}});

/* ---------- guardar ---------- */
async function guardar(){
  const art=window.claude?await window.claude.use("artifact"):null;
  if(!art){msg("Esta vista no permite guardar. Abrí el mapa desde tu cuenta de Claude.");return}
  $("bSave").disabled=true;msg("Guardando…");
  try{await art.publish(documento());msg("Guardado. La página se actualiza para todos.")}
  catch(err){const c=err&&err.code;
    if(c==="conflict")msg("Había una versión más nueva; se está recargando.");
    else if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"||c==="capability_disabled"){soloLectura=true;editando=false;msg("Esta vista es solo de lectura: no se pueden guardar cambios.");refrescar()}
    else if(c==="rate_limited")msg("Demasiados guardados seguidos. Esperá un momento y volvé a guardar.");
    else if(c==="too_large")msg("El mapa quedó demasiado pesado para guardarse.");
    else msg("No se pudo guardar ("+(c||"error")+"). Probá de nuevo.");
    const b=$("bSave");b&&(b.disabled=false)}
}

/* ---------- PDF para imprimir ---------- */
async function descargar(){
  const dl=window.claude?await window.claude.use("downloads"):null;
  if(!dl||!window.jspdf){msg("No se pudo preparar la descarga en esta vista.");return}
  msg("Preparando el PDF…");
  try{
    const img=new Image();
    await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(paginaImpresion())});
    const c=document.createElement("canvas");c.width=3508;c.height=2480;
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    const pdf=new window.jspdf.jsPDF({orientation:"l",unit:"mm",format:"a4"});
    pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,297,210);
    await dl.save({filename:"mapa-campamento.pdf",data:pdf.output("blob")});
    msg("");
  }catch(err){const c=err&&err.code;msg(c==="declined"||c==="cancelled"?"":"No se pudo descargar el PDF.")}
}

/* ---------- inicio ---------- */
refrescar();
let centrado=false;const cIni=()=>{if(centrado||sel>=0)return;const sc=$("scroller");if(sc.scrollWidth>sc.clientWidth+10){centrar(360,false);if(sc.scrollLeft>0)centrado=true}else if(sc.scrollWidth>0&&sc.scrollWidth<=sc.clientWidth+10)centrado=true};
[60,300,800,1500,2500].forEach(t=>setTimeout(cIni,t));addEventListener("load",cIni);$("scroller").addEventListener("pointerdown",()=>{centrado=true},{once:true});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!drag)dibujar()});
(async()=>{
  
  try{const u=window.claude?await window.claude.use("user"):null;
    if(u&&((await u.isOwner())||(await u.canEdit())))dueno=true}catch(e){}
  herramientas();
})();
})();
</script>
